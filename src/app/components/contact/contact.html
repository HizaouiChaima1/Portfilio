<section id="contact" class="contact-section">
  <div class="container">
    <div class="contact-content-centered">
      <!-- Informations de contact -->
      <div class="contact-info-centered" data-animate="fade-up">
        <h2 class="section-title-centered">Contact Me</h2>

        <div class="contact-methods-centered">
          @for (method of contactMethods; track method.title) {
          <div class="contact-method-centered">
            <div class="method-icon-centered">
              <div class="icon-wrapper-centered">{{ method.icon }}</div>
            </div>
            <div class="method-details-centered">
              <h4>{{ method.title }}</h4>
              <p>{{ method.value }}</p>
              @if (method.link) {
              <a [href]="method.link" class="method-link-centered" target="_blank">
                Link
                <span class="link-arrow">→</span>
              </a>
              }
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
