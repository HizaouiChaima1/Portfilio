<section id="contact" class="contact-section">
 <div class="container">
    <div class="contact-content">
      <!-- Informations de contact -->
      <div class="contact-info" data-animate="fade-right">
        <h2 class="section-title">Contact Me</h2>
        
        <div class="contact-methods">
          @for (method of contactMethods; track method.title) {
            <div class="contact-method">
              <div class="method-icon">
                <div class="icon-wrapper">{{ method.icon }}</div>
              </div>
              <div class="method-details">
                <h4>{{ method.title }}</h4>
                <p>{{ method.value }}</p>
                @if (method.link) {
                  <a [href]="method.link" class="method-link" target="_blank">
                   Link
                    <span class="link-arrow">→</span>
                  </a>
                }
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Formulaire de contact -->
      <div class="contact-form" data-animate="fade-left">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group">
            <label for="name" class="form-label">Votre nom</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required ngModel
                   class="form-input" [class.invalid]="name.invalid && name.touched">
            <div class="input-glow"></div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Votre email</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required ngModel
                   class="form-input" [class.invalid]="email.invalid && email.touched">
            <div class="input-glow"></div>
          </div>

          <div class="form-group">
            <label for="subject" class="form-label">Sujet</label>
            <input type="text" id="subject" name="subject" placeholder="Proposition de projet" required ngModel
                   class="form-input" [class.invalid]="subject.invalid && subject.touched">
            <div class="input-glow"></div>
          </div>

          <div class="form-group">
            <label for="message" class="form-label">Votre message</label>
            <textarea id="message" name="message" placeholder="Décrivez votre projet en détail..." rows="5" required ngModel
                      class="form-textarea" [class.invalid]="message.invalid && message.touched"></textarea>
            <div class="input-glow"></div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="!contactForm.valid">
            <span class="btn-text">Envoyer</span>
            <div class="btn-glow"></div>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
